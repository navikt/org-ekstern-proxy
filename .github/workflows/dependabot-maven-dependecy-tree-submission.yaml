name: Monitor dependencies with Dependabot
on:
  push:
    branches:
      - main
    paths:
      - "build.gradle"
      - "settings.gradle"
jobs:
  dependencies:
    runs-on: ubuntu-latest
    permissions: # The Dependency Submission API requires write permission
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Setup Gradle to generate and submit dependency graphs
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # ratchet:gradle/gradle-build-action@v3.5.0
        with:
          dependency-graph: generate-and-submit
      - name: Run a build, generating the dependency graph snapshot which will be submitted
        run: ./gradlew build
